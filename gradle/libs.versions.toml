[versions]
agp = "9.1.0"
coreKtx = "1.19.0"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
activityCompose = "1.10.1"
kotlin = "2.4.10"
kotlinxDatetime = "0.8.0"
ktor = "3.5.2"
composeMultiplatform = "1.11.1"
# Web fixes for dialog accessibility owners (CMP-9368) and canvas resize (CMP-8615).
composeWebRuntime = "1.13.0-alpha02"
skikoWebRuntime = "0.153.0"
composeUiTest = "1.11.2"
composeUiTestManifest = "1.11.0"
jetbrainsKotlinPluginSerialization = "2.4.10"
