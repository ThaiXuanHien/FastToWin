services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fasttowin
      POSTGRES_USER: fasttowin
      POSTGRES_PASSWORD: fasttowin
    ports:
      - "5432:5432"
    volumes:
      - fasttowin-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fasttowin -d fasttowin"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  fasttowin-postgres:
