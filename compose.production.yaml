name: fasttowin-production

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fasttowin}
      POSTGRES_USER: ${POSTGRES_USER:-fasttowin_app}
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
    secrets:
      - database_password
    volumes:
      - fasttowin-production-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  server:
    image: ${FASTTOWIN_SERVER_IMAGE:-fasttowin-server}:${FASTTOWIN_RELEASE_TAG:-local}
    build:
      context: .
      dockerfile: deploy/server.Dockerfile
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      FASTTOWIN_ENV: prod
      SERVER_HOST: 0.0.0.0
      PORT: 8080
      DATABASE_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-fasttowin}
      DATABASE_USER: ${POSTGRES_USER:-fasttowin_app}
      DATABASE_PASSWORD_FILE: /run/secrets/database_password
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      FASTTOWIN_PUBLIC_URL: https://${FASTTOWIN_DOMAIN:?Set FASTTOWIN_DOMAIN in deploy/.env.production}
      FASTTOWIN_WEB_ORIGINS: https://${FASTTOWIN_DOMAIN:?Set FASTTOWIN_DOMAIN in deploy/.env.production}
      FASTTOWIN_WEB_BASE_URL: https://${FASTTOWIN_DOMAIN:?Set FASTTOWIN_DOMAIN in deploy/.env.production}
      FASTTOWIN_TRUST_PROXY_HEADERS: "true"
      FASTTOWIN_SMTP_HOST: ${FASTTOWIN_SMTP_HOST:?Set FASTTOWIN_SMTP_HOST}
      FASTTOWIN_SMTP_PORT: ${FASTTOWIN_SMTP_PORT:-587}
      FASTTOWIN_SMTP_USERNAME: ${FASTTOWIN_SMTP_USERNAME:?Set FASTTOWIN_SMTP_USERNAME}
      FASTTOWIN_SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      FASTTOWIN_SMTP_FROM_EMAIL: ${FASTTOWIN_SMTP_FROM_EMAIL:?Set FASTTOWIN_SMTP_FROM_EMAIL}
      FASTTOWIN_SMTP_FROM_NAME: ${FASTTOWIN_SMTP_FROM_NAME:-Fast To Win}
      FASTTOWIN_SMTP_STARTTLS: ${FASTTOWIN_SMTP_STARTTLS:-true}
      FASTTOWIN_SMTP_SSL: ${FASTTOWIN_SMTP_SSL:-false}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase_service_account
      FASTTOWIN_PUSH_ZONE: ${FASTTOWIN_PUSH_ZONE:-Asia/Ho_Chi_Minh}
      FASTTOWIN_DAILY_PUSH_HOUR: ${FASTTOWIN_DAILY_PUSH_HOUR:-19}
      FASTTOWIN_MAINTENANCE: ${FASTTOWIN_MAINTENANCE:-false}
      FASTTOWIN_MAINTENANCE_MESSAGE: ${FASTTOWIN_MAINTENANCE_MESSAGE:-}
    secrets:
      - database_password
      - smtp_password
      - firebase_service_account
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  web:
    image: ${FASTTOWIN_WEB_IMAGE:-fasttowin-web}:${FASTTOWIN_RELEASE_TAG:-local}
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      FASTTOWIN_DOMAIN: ${FASTTOWIN_DOMAIN:?Set FASTTOWIN_DOMAIN in deploy/.env.production}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in deploy/.env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - fasttowin-production-caddy-data:/data
      - fasttowin-production-caddy-config:/config
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v3.11.3
    restart: unless-stopped
    mem_limit: 384m
    depends_on:
      server:
        condition: service_healthy
      alertmanager:
        condition: service_started
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - fasttowin-production-prometheus:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  alertmanager:
    image: prom/alertmanager:v0.32.1
    restart: unless-stopped
    mem_limit: 128m
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./deploy/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - fasttowin-production-alertmanager:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  loki:
    image: grafana/loki:3.7.0
    restart: unless-stopped
    mem_limit: 512m
    command:
      - -config.file=/etc/loki/loki.yml
    volumes:
      - ./deploy/monitoring/loki.yml:/etc/loki/loki.yml:ro
      - fasttowin-production-loki:/loki
    ports:
      - "127.0.0.1:3100:3100"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  alloy:
    image: grafana/alloy:v1.18.0
    restart: unless-stopped
    mem_limit: 256m
    user: "0:0"
    depends_on:
      loki:
        condition: service_started
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./deploy/monitoring/alloy.config:/etc/alloy/config.alloy:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - fasttowin-production-alloy:/var/lib/alloy/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  grafana:
    image: grafana/grafana:13.2.0
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      alertmanager:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    secrets:
      - grafana_admin_password
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - fasttowin-production-grafana:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

secrets:
  database_password:
    file: ./deploy/secrets/database_password.txt
  smtp_password:
    file: ./deploy/secrets/smtp_password.txt
  firebase_service_account:
    file: ./deploy/secrets/firebase-service-account.json
  grafana_admin_password:
    file: ./deploy/secrets/grafana_admin_password.txt

volumes:
  fasttowin-production-postgres:
  fasttowin-production-caddy-data:
  fasttowin-production-caddy-config:
  fasttowin-production-prometheus:
  fasttowin-production-alertmanager:
  fasttowin-production-loki:
  fasttowin-production-alloy:
  fasttowin-production-grafana:
