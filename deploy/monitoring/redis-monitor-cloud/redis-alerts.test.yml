  "evaluation_interval": "15s",
  "tests": [
    {
      "name": "no collector series",
      "interval": "1m",
      "input_series": [],
      "alert_rule_test": [
        {
          "eval_time": "0m",
          "alertname": "FastToWinRedisCollectorMissing",
          "exp_alerts": []
        },
        {
          "eval_time": "1m",
          "alertname": "FastToWinRedisCollectorMissing",
          "exp_alerts": [
            {
              "exp_labels": {
                "severity": "critical",
                "job": "fasttowin-redis-monitor",
                "instance": "redis-primary"
              },
              "exp_annotations": {
                "summary": "Redis collector unavailable",
                "description": "Check the private collector process and scrape path; no automatic repair."
              }
            }
          ]
        }
      ]
    },
    {
      "name": "scrape down",
      "interval": "1m",
      "input_series": [
        {
          "series": "up{job=\"fasttowin-redis-monitor\",instance=\"redis-primary\"}",
          "values": "0x10"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "1m",
          "alertname": "FastToWinRedisCollectorMissing",
          "exp_alerts": [
            {
              "exp_labels": {
                "severity": "critical",
                "job": "fasttowin-redis-monitor",
                "instance": "redis-primary"
              },
              "exp_annotations": {
                "summary": "Redis collector unavailable",
                "description": "Check the private collector process and scrape path; no automatic repair."
              }
            }
          ]
        },
        {
          "eval_time": "2m",
          "alertname": "FastToWinRedisCollectionFailed",
          "exp_alerts": []
        }
      ]
    },
