global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [redis-alerts.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
scrape_configs:
  - job_name: fasttowin-redis-monitor
    scrape_timeout: 5s
    static_configs:
      - targets: ['collector:19121']
