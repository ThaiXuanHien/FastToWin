groups:
  - name: fasttowin
    rules:
      - alert: FastToWinServerDown
        expr: up{job="fasttowin-server"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Fast To Win backend không phản hồi"
          description: "Prometheus không lấy được metrics từ backend trong 2 phút."

      - alert: FastToWinHighJvmMemory
        expr: fasttowin_jvm_memory_used_bytes / fasttowin_jvm_memory_max_bytes > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "JVM đang sử dụng trên 85% heap"
          description: "Heap cao liên tục 10 phút; cần kiểm tra tải, GC và log lỗi."

      - alert: FastToWinWebSocketRateLimitSpike
        expr: increase(fasttowin_websocket_rate_limited_total[5m]) > 100
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "WebSocket bị rate limit tăng cao"
          description: "Có hơn 100 thao tác bị giới hạn trong 5 phút."

      - alert: FastToWinInvalidMessageSpike
        expr: increase(fasttowin_websocket_invalid_messages_total[5m]) > 25
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Nhiều WebSocket message không hợp lệ"
          description: "Có hơn 25 message sai định dạng trong 5 phút."

      - alert: FastToWinRoomOwnershipRoutingUnavailable
        expr: increase(fasttowin_room_ownership_routes_total{job="fasttowin-server",outcome="unavailable"}[2m]) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Định tuyến phòng liên tục gặp lỗi"
          description: "Kiểm tra trạng thái ký của A và B, DNS nội bộ và kết nối PostgreSQL."

      - alert: FastToWinRoomOwnershipSettlementFailed
        expr: increase(fasttowin_room_ownership_settlement_failures_total{job="fasttowin-server"}[5m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Có lỗi chốt trận trong 5 phút qua"
          description: "Kiểm tra log chốt trận và số trận đang chờ ghi kết quả trước khi drain."

      - alert: FastToWinRoomOwnershipEventBacklog
        expr: fasttowin_room_ownership_oldest_queued_event_seconds{job="fasttowin-server"} > 25
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Sự kiện phòng chờ gửi quá 25 giây"
          description: "Kiểm tra hàng đợi gửi sự kiện và kết nối PostgreSQL của backend."
