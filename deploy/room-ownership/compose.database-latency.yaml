# Local-only TCP delay. Remove the direct alias so strict fixture DNS cannot bypass it.
services:
  postgres:
    networks:
      fixture:
        aliases: !override [postgres]
  backend-a:
    environment:
      DATABASE_URL: jdbc:postgresql://${FTW_PILOT_NAME:?}-pg.railway.internal:5433/fasttowin_room_pilot
  backend-b:
    environment:
      DATABASE_URL: jdbc:postgresql://${FTW_PILOT_NAME:?}-pg.railway.internal:5433/fasttowin_room_pilot
  database-latency:
    image: ghcr.io/shopify/toxiproxy:2.12.0@sha256:9378ed52a28bc50edc1350f936f518f31fa95f0d15917d6eb40b8e376d1a214e
    command: [-host=0.0.0.0, -config=/config/proxies.json]
    cpus: 1
    mem_limit: 128000000
    memswap_limit: 128000000
    volumes: ["./toxiproxy-database-latency.json:/config/proxies.json:ro"]
    networks:
      fixture:
        aliases: ["${FTW_PILOT_NAME:?}-pg.railway.internal"]
