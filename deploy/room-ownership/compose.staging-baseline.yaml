# Private DNS rehearsal of the Railway runner. No host ports or cloud credentials.
x-backend-environment: &backend-environment
  FASTTOWIN_ENV: dev
  SERVER_HOST: "::"
  PORT: "8080"
  DATABASE_URL: jdbc:postgresql://${FTW_PILOT_NAME:?}-pg.railway.internal:5432/fasttowin_room_pilot
  DATABASE_USER: fasttowin_room_pilot
  DATABASE_POOL_SIZE: ${FTW_PILOT_BACKEND_POOL_SIZE:-10}
  DATABASE_PASSWORD: ${FASTTOWIN_ROOM_OWNERSHIP_DATABASE_PASSWORD:?}
  FASTTOWIN_ROOM_OWNERSHIP_FIXTURE_ID: ${FASTTOWIN_ROOM_OWNERSHIP_FIXTURE_ID:?}
  FASTTOWIN_ROOM_OWNERSHIP_ACCOUNTS: ${FASTTOWIN_ROOM_OWNERSHIP_ACCOUNTS:?}
  FASTTOWIN_ROOM_OWNERSHIP_MODE: pilot
  FASTTOWIN_ROOM_OWNERSHIP_ACCEPTANCE: "true"
  FASTTOWIN_ROOM_OWNERSHIP_PEER_SECRET: ${FASTTOWIN_ROOM_OWNERSHIP_PEER_SECRET:?}
  FASTTOWIN_RATE_LIMIT_STORE: redis
  FASTTOWIN_RATE_LIMIT_REDIS_URL: redis://redis:6379
  FASTTOWIN_RATE_LIMIT_NAMESPACE: ${FTW_PILOT_NAME:?}-limits
  FASTTOWIN_PRESENCE_STORE: redis
  FASTTOWIN_PRESENCE_REDIS_URL: redis://redis:6379
  FASTTOWIN_PRESENCE_NAMESPACE: ${FTW_PILOT_NAME:?}-presence

x-backend: &backend
  image: ${FTW_PILOT_BACKEND_IMAGE:?}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  healthcheck:
    test: [CMD, wget, -qO, /dev/null, "http://[::1]:8080/ready"]
    interval: 2s
    timeout: 3s
    retries: 30
    start_period: 20s
  networks: [fixture]

services:
  postgres:
    image: postgres:18-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
    environment:
      POSTGRES_DB: fasttowin_room_pilot
      POSTGRES_USER: fasttowin_room_pilot
      POSTGRES_PASSWORD: ${FASTTOWIN_ROOM_OWNERSHIP_DATABASE_PASSWORD:?}
    volumes: [postgres-data:/var/lib/postgresql]
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, fasttowin_room_pilot, -d, fasttowin_room_pilot]
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      fixture:
        aliases: ["${FTW_PILOT_NAME:?}-pg.railway.internal"]
  redis:
    image: redis:8-alpine@sha256:71885d8cc6e42f2bc0aa2eb853bfc4be200b5108a46ac50e117ae1df0531fb80
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 2s
      retries: 30
    networks: [fixture]
  backend-a:
    <<: *backend
    environment:
      <<: *backend-environment
      FASTTOWIN_ROOM_OWNERSHIP_NODE_ID: 00000000-0000-4000-8000-00000000000a
      FASTTOWIN_ROOM_OWNERSHIP_PEER_ID: 00000000-0000-4000-8000-00000000000b
      FASTTOWIN_ROOM_OWNERSHIP_PEER_URL: http://${FTW_PILOT_NAME:?}-b.railway.internal:8080
    networks:
      fixture:
        aliases: ["${FTW_PILOT_NAME:?}-a.railway.internal"]
  backend-b:
    <<: *backend
    environment:
      <<: *backend-environment
      FASTTOWIN_ROOM_OWNERSHIP_NODE_ID: 00000000-0000-4000-8000-00000000000b
      FASTTOWIN_ROOM_OWNERSHIP_PEER_ID: 00000000-0000-4000-8000-00000000000a
      FASTTOWIN_ROOM_OWNERSHIP_PEER_URL: http://${FTW_PILOT_NAME:?}-a.railway.internal:8080
    networks:
      fixture:
        aliases: ["${FTW_PILOT_NAME:?}-b.railway.internal"]
  runner:
    image: ${FTW_PILOT_RUNNER_IMAGE:?}
    profiles: [runner]
    environment:
      RAILWAY_PROJECT_ID: b5c5db71-2df8-46da-84fb-d9b9df6d7951
      RAILWAY_ENVIRONMENT_ID: 8bcf4119-3a6b-49b3-b4ff-8ea20080f3b9
      RAILWAY_ENVIRONMENT_NAME: staging
      RAILWAY_SERVICE_NAME: ${FTW_PILOT_NAME:?}-runner
      FTW_PILOT_SUITE: baseline
      FTW_PILOT_DEADLINE_UTC: ${FTW_PILOT_DEADLINE_UTC:?}
      FTW_PILOT_DATABASE_HOST: ${FTW_PILOT_NAME:?}-pg.railway.internal
      FASTTOWIN_ROOM_OWNERSHIP_FIXTURE_ID: ${FASTTOWIN_ROOM_OWNERSHIP_FIXTURE_ID:?}
      FASTTOWIN_ROOM_OWNERSHIP_ACCOUNTS: ${FASTTOWIN_ROOM_OWNERSHIP_ACCOUNTS:?}
      FASTTOWIN_ROOM_OWNERSHIP_DATABASE_PASSWORD: ${FASTTOWIN_ROOM_OWNERSHIP_DATABASE_PASSWORD:?}
      FASTTOWIN_ROOM_OWNERSHIP_FIXTURE_PASSWORD: ${FASTTOWIN_ROOM_OWNERSHIP_FIXTURE_PASSWORD:?}
    networks: [fixture]
networks:
  fixture:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
    ipam:
      config:
        - subnet: ${FTW_PILOT_IPV6_SUBNET:?}
volumes:
  postgres-data:
