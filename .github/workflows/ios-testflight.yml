name: iOS TestFlight

# Builds a signed release archive on a hosted Mac and uploads it to TestFlight.
# Signing is cloud-managed through the App Store Connect API key, so no certificate
# or provisioning profile lives in the repo or in secrets.
# Required: secret APP_STORE_CONNECT_API_KEY_P8 (full .p8 text), repository variables
# APP_STORE_CONNECT_KEY_ID and APP_STORE_CONNECT_ISSUER_ID.

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: 'App version shown in TestFlight (CFBundleShortVersionString)'
        required: true
        default: '1.0'

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: Archive and upload to TestFlight
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      TEAM_ID: Y4S52B8V9C
      ASC_KEY_ID: ${{ vars.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
      BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_P8" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ]; then
            echo "::error::Missing APP_STORE_CONNECT_API_KEY_P8 secret or APP_STORE_CONNECT_KEY_ID / APP_STORE_CONNECT_ISSUER_ID variables."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey.p8" >> "$GITHUB_ENV"

      # Automatic signing creates a new Apple Development certificate on every fresh runner
      # unless one is already in the keychain, and the account allows only a handful. Import the
      # fixed CI development identity so the archive reuses it; export still uses cloud signing.
      - name: Install CI development certificate
        env:
          DEV_CERT_P12: ${{ secrets.IOS_DEV_CERT_P12_BASE64 }}
          DEV_CERT_PASSWORD: ${{ secrets.IOS_DEV_CERT_PASSWORD }}
        run: |
          if [ -z "$DEV_CERT_P12" ] || [ -z "$DEV_CERT_PASSWORD" ]; then
            echo "::error::Missing IOS_DEV_CERT_P12_BASE64 / IOS_DEV_CERT_PASSWORD secrets."
            exit 1
          fi
          keychain="$RUNNER_TEMP/ci-signing.keychain-db"
          keychain_password=$(uuidgen)
          printf '%s' "$DEV_CERT_P12" | base64 --decode > "$RUNNER_TEMP/ci-dev.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/ci-dev.p12" -k "$keychain" -P "$DEV_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/ci-dev.p12"
          echo "CI_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$keychain"

      - name: Archive release build
        run: |
          chmod +x gradlew
          xcodebuild archive \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/FastToWin.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="${{ inputs.marketing_version }}" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Verify iOS SDK in the release archive
        run: |
          archive="$RUNNER_TEMP/FastToWin.xcarchive"
          app_path=$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:ApplicationPath' "$archive/Info.plist")
          sdk=$(/usr/libexec/PlistBuddy -c 'Print :DTSDKName' "$archive/Products/$app_path/Info.plist")

          if [[ ! "$sdk" =~ ^iphoneos([0-9]+)(\.[0-9]+)*$ ]] || (( BASH_REMATCH[1] < 27 )); then
            echo "::error::Expected an iOS 27 or later SDK in the release archive, got '$sdk'."
            exit 1
          fi

          echo "Release archive SDK: $sdk" >> "$GITHUB_STEP_SUMMARY"

      - name: Export and upload to App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/FastToWin.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded version ${{ inputs.marketing_version }} build $BUILD_NUMBER to App Store Connect." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove API key and CI keychain
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/asc"
          if [ -n "${CI_KEYCHAIN:-}" ]; then security delete-keychain "$CI_KEYCHAIN" || true; fi
