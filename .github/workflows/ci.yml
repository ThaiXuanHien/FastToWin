name: CI

on:
  push:
    branches-ignore:
      - 'codex/mobile-build-1.0.17'
  pull_request:
  workflow_dispatch:
    inputs:
      run_android_ui:
        description: 'Run Android UI tests on an emulator (explicit opt-in)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: admin_test
          POSTGRES_USER: fasttowin
          POSTGRES_PASSWORD: fasttowin
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U fasttowin -d admin_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:15432/admin_test
      TEST_DATABASE_USER: fasttowin
      TEST_DATABASE_PASSWORD: fasttowin

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Install Android SDK 37
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.1.0"

      - name: Run regression tests and compile clients
        run: >-
          ./gradlew
          :protocol:jvmTest
          :server:test
          :shared:checkLocalizedUiText
          :shared:testAndroidHostTest
          :app:compileDevDebugAndroidTestKotlin
          :app:assembleDevDebug
          :app:assembleProdDebug
          :webApp:compileKotlinWasmJs
          --no-daemon
          --no-configuration-cache

      - name: Validate production deployment configuration
        run: |
          docker compose --env-file deploy/.env.production.example -f compose.production.yaml config --quiet
          docker run --rm \
            -e FASTTOWIN_DOMAIN=play.fasttowin.vn \
            -e ACME_EMAIL=admin@fasttowin.vn \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.4-alpine \
            caddy validate --config /etc/caddy/Caddyfile

      - name: Generate coverage reports and enforce measured thresholds
        run: >-
          ./gradlew
          :server:koverHtmlReport :server:koverXmlReport
          :shared:koverHtmlReport :shared:koverXmlReport
          :server:koverVerify :shared:koverVerify
          --no-daemon
          --no-configuration-cache

      - name: Set up Node.js for isolated load baseline
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Validate load-test safeguards and run bounded PostgreSQL workload
        run: |
          node --test scripts/tests/load-test-utils.test.mjs
          ./gradlew :server:installDist --no-daemon --no-configuration-cache
          mkdir -p .tmp
          printf '%s' 'fasttowin' > .tmp/load-test-password.txt
          node --input-type=module -e "import {writeFileSync} from 'node:fs'; import {resolve} from 'node:path'; writeFileSync('.tmp/load-test-settings.json', JSON.stringify({url:'jdbc:postgresql://127.0.0.1:15432/admin_test',user:'fasttowin',passwordFile:resolve('.tmp/load-test-password.txt')}));"
          node scripts/load-test.mjs --pairs 2 --postgres-settings .tmp/load-test-settings.json

      - name: Upload isolated load baseline
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: isolated-load-baseline
          path: .artifacts/load-tests/*/report.json
          retention-days: 7
          if-no-files-found: warn

      - name: Upload server and shared coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: server-and-shared-coverage
          path: |
            server/build/reports/kover/
            shared/build/reports/kover/
          if-no-files-found: warn

      - name: Upload dev APK
        uses: actions/upload-artifact@v7
        with:
          name: fast-to-win-dev-apk
          path: app/build/outputs/apk/dev/debug/app-dev-debug.apk
          if-no-files-found: error

      - name: Upload production QA APK
        uses: actions/upload-artifact@v7
        with:
          name: fast-to-win-prod-qa-apk
          path: app/build/outputs/apk/prod/debug/app-prod-debug.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-and-integration-test-reports
          path: |
            protocol/build/reports/tests/jvmTest/
            server/build/reports/tests/test/
            shared/build/reports/tests/testAndroidHostTest/
          if-no-files-found: warn

  android-screenshot-test:
    name: Android screenshot regression
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Install Android SDK 37
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.1.0"

      - name: Validate 2D Arcade screenshots
        run: >-
          ./gradlew
          :app:validateDevDebugScreenshotTest
          --no-daemon
          --no-configuration-cache

      - name: Upload screenshot report and comparison images
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: arcade-screenshot-report-${{ github.run_number }}-${{ github.sha }}
          path: |
            app/build/reports/screenshotTest/
            app/build/outputs/screenshotTest-results/
          retention-days: 7
          if-no-files-found: warn

  web-e2e:
    name: Web E2E (responsive + multi-browser)
    needs: build-and-test
    runs-on: ubuntu-latest
    # Dependency downloads can consume 15+ minutes before the measured
    # ~21-minute browser suite, JS fallback and durable-wallet phases start.
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: admin_test
          POSTGRES_USER: fasttowin
          POSTGRES_PASSWORD: fasttowin
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U fasttowin -d admin_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Use Ubuntu primary package archive
        # Avoid the intermittent slow Azure mirror. Keep the runner's suites,
        # components and Ubuntu signing keys; only replace the archive URL.
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '\|://azure\.archive\.ubuntu\.com/ubuntu|d' /etc/apt/apt-mirrors.txt
          fi
          for apt_source_file in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$apt_source_file" ]; then
              sudo sed -i 's|https\?://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$apt_source_file"
            fi
          done

      - name: Install E2E dependencies
        working-directory: e2e
        run: |
          npm install --global pnpm@11.19.0
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Install Android SDK 37
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.1.0"

      - name: Build isolated E2E server and Web bundle
        run: |
          chmod +x gradlew
          # Keep Wasm and compatibility JS in separate Gradle processes. Both
          # compilers in one 2 GiB JVM can retain enough IR to exhaust CI RAM.
          ./gradlew :server:installDist :webApp:wasmJsBrowserDevelopmentWebpack --no-daemon --no-configuration-cache --max-workers=1
          ./gradlew :webApp:jsBrowserDevelopmentWebpack --no-daemon --no-configuration-cache --max-workers=1

      - name: Test Web against an isolated in-memory backend
        working-directory: e2e
        # Firefox needs a display-backed WebGL2 context for Compose's canvas.
        # Playwright's --with-deps install provides Xvfb on Linux runners.
        run: |
          xvfb-run --auto-servernum pnpm test
          pnpm test:js-fallback

      - name: Test durable wallet and friend reports through real Web UI and isolated PostgreSQL
        working-directory: e2e
        run: |
          mkdir -p ../.tmp
          printf '%s' 'fasttowin' > ../.tmp/web-e2e-password.txt
          node --input-type=module -e "import {writeFileSync} from 'node:fs'; import {resolve} from 'node:path'; writeFileSync('../.tmp/web-e2e-settings.json', JSON.stringify({url:'jdbc:postgresql://127.0.0.1:15432/admin_test',user:'fasttowin',passwordFile:resolve('../.tmp/web-e2e-password.txt')}));"
          E2E_POSTGRES_SETTINGS=../.tmp/web-e2e-settings.json pnpm exec playwright test --project=chromium-wallet --project=chromium-report-postgres --project=webkit-report-postgres

      - name: Upload Web E2E report and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-e2e-multi-browser
          path: |
            e2e/playwright-report/
            e2e/test-results/
            e2e/playwright-report-js-fallback/
            e2e/test-results-js-fallback/
            e2e/playwright-report-wallet/
            e2e/test-results-wallet/
          retention-days: 7
          if-no-files-found: warn

  android-ui-test:
    # Emulator use is always explicit; normal push/PR checks remain host-only.
    if: github.event_name == 'workflow_dispatch' && inputs.run_android_ui
    name: Android UI test
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Install Android SDK 37
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.1.0"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Compose UI tests
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: bash scripts/run-android-ui-tests.sh

      - name: Upload Android UI test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-ui-test-report
          path: |
            app/build/reports/androidTests/connected/
            .artifacts/android-ui/
          include-hidden-files: true
          if-no-files-found: warn

  ios-build:
    name: iOS simulator build
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build iOS simulator app
        run: |
          chmod +x gradlew
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            build


      - name: Archive and export iOS release IPA
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/mobile-build-1.0.17'
        env:
          ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          ASC_KEY_ID: ${{ vars.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          umask 077
          build_root="$RUNNER_TEMP/ftw-ios-release"
          mkdir -p "$build_root"
          key_dir="$(mktemp -d "$RUNNER_TEMP/ftw-asc.XXXXXX")"
          key_file="$key_dir/AuthKey.p8"
          trap 'rm -f "$key_file"; rmdir "$key_dir"' EXIT
          : "${ASC_KEY_P8:?Missing App Store Connect key}" "${ASC_KEY_ID:?Missing App Store Connect key ID}" "${ASC_ISSUER_ID:?Missing App Store Connect issuer ID}"
          printf '%s\n' "$ASC_KEY_P8" > "$key_file"
          unset ASC_KEY_P8

          xcodebuild archive \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$build_root/FastToWin.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$key_file" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM=Y4S52B8V9C \
            CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION=1.0.17 \
            CURRENT_PROJECT_VERSION=18

          cat > "$build_root/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>Y4S52B8V9C</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$build_root/FastToWin.xcarchive" \
            -exportOptionsPlist "$build_root/ExportOptions.plist" \
            -exportPath "$build_root/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$key_file" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

          ipas=("$build_root"/export/*.ipa)
          [[ "${#ipas[@]}" -eq 1 ]]
          artifact="$build_root/FastToWin-iOS-1.0.17-18.ipa"
          mv "${ipas[0]}" "$artifact"
          ditto -x -k "$artifact" "$build_root/verify"
          bundles=("$build_root"/verify/Payload/*.app)
          [[ "${#bundles[@]}" -eq 1 ]]
          app="${bundles[0]}"
          codesign --verify --deep --strict "$app"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")" == 'com.hienthai.fastowin' ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")" == '1.0.17' ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist")" == '18' ]]
          (cd "$build_root" && shasum -a 256 FastToWin-iOS-1.0.17-18.ipa > FastToWin-iOS-1.0.17-18.sha256)

      - name: Upload iOS IPA artifact
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/mobile-build-1.0.17'
        uses: actions/upload-artifact@v7
        with:
          name: FastToWin-iOS-1.0.17-18
          path: |
            ${{ runner.temp }}/ftw-ios-release/FastToWin-iOS-1.0.17-18.ipa
            ${{ runner.temp }}/ftw-ios-release/FastToWin-iOS-1.0.17-18.sha256
          if-no-files-found: error
          retention-days: 7
