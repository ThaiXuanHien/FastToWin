name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fasttowin_test
          POSTGRES_USER: fasttowin
          POSTGRES_PASSWORD: fasttowin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fasttowin -d fasttowin_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/fasttowin_test
      TEST_DATABASE_USER: fasttowin
      TEST_DATABASE_PASSWORD: fasttowin

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Install Android SDK 37
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.1.0"

      - name: Run regression tests and compile clients
        run: >-
          ./gradlew
          :server:test
          :shared:testAndroidHostTest
          :app:compileDevDebugAndroidTestKotlin
          :app:assembleDevDebug
          :webApp:compileKotlinWasmJs
          --no-daemon
          --no-configuration-cache

      - name: Upload dev APK
        uses: actions/upload-artifact@v7
        with:
          name: fast-to-win-dev-apk
          path: app/build/outputs/apk/dev/debug/app-dev-debug.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-and-integration-test-reports
          path: |
            server/build/reports/tests/test/
            shared/build/reports/tests/testAndroidHostTest/
          if-no-files-found: warn

  web-e2e:
    name: Web E2E (responsive + multi-browser)
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install E2E dependencies
        working-directory: e2e
        run: |
          npm install --global pnpm@11.19.0
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Install Android SDK 37
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.1.0"

      - name: Build isolated E2E server and Web bundle
        run: |
          chmod +x gradlew
          # Keep Wasm and compatibility JS in separate Gradle processes. Both
          # compilers in one 2 GiB JVM can retain enough IR to exhaust CI RAM.
          ./gradlew :server:installDist :webApp:wasmJsBrowserDevelopmentWebpack --no-daemon --no-configuration-cache --max-workers=1
          ./gradlew :webApp:jsBrowserDevelopmentWebpack --no-daemon --no-configuration-cache --max-workers=1

      - name: Test Web against an isolated in-memory backend
        working-directory: e2e
        # Firefox needs a display-backed WebGL2 context for Compose's canvas.
        # Playwright's --with-deps install provides Xvfb on Linux runners.
        run: |
          xvfb-run --auto-servernum pnpm test
          pnpm test:js-fallback

      - name: Upload Web E2E report and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-e2e-multi-browser
          path: |
            e2e/playwright-report/
            e2e/test-results/
            e2e/playwright-report-js-fallback/
            e2e/test-results-js-fallback/
          retention-days: 7
          if-no-files-found: warn

  android-ui-test:
    name: Android UI test
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Install Android SDK 37
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.1.0"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Compose UI tests
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: >-
            ./gradlew
            :app:connectedDevDebugAndroidTest
            --no-daemon
            --no-configuration-cache

      - name: Upload Android UI test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-ui-test-report
          path: app/build/reports/androidTests/connected/
          if-no-files-found: warn

  ios-build:
    name: iOS simulator build
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build iOS simulator app
        run: |
          chmod +x gradlew
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
